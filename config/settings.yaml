app:
  name: "IBKR Options Analyzer & Dashboard"
  host: "127.0.0.1"
  port: 8000
  default_theme: "print" # "print" (NYT Paper) or "terminal" (Obsidian)
  log_level: "INFO"

ibkr:
  host: "127.0.0.1"
  port: 4001             # Default to 4001 (IBKR Gateway Live Read-Only)
  client_id: 77
  connect_timeout_sec: 3.0
  read_only_enforced: true
  # Market Data Types:
  # 3 = Delayed (15-min delayed from current session - DEFAULT)
  # 4 = Delayed-Frozen (auto-fallback outside market hours)
  # 1 = Live OPRA (for future subscription)
  # 2 = Frozen (live fallback outside market hours)
  market_data_mode: "DELAYED"
  default_market_data_type: 3
  fallback_market_data_type: 4

watchlist:
  default_ticker: "NVDA"
  hardcoded_tickers:
    - "NVDA"
    - "AVGO"
    - "CRDO"
    - "PLTR"
  allow_custom_ticker: true
  custom_ticker_regex: "^[A-Z]{1,5}$"

options_chain:
  dte_min: 30
  dte_max: 120           # Inclusive expiration window: dte_min <= DTE <= dte_max (30..120d)
  default_range_pct: 0.20 # +-20% around underlying spot price
  allowed_range_pcts:
    - 0.10
    - 0.15
    - 0.20
    - 0.25
    - 0.35
    - 0.50
  default_strike_step: null # Default strike stride: null = Auto exchange-native selection
  allowed_strike_steps:
    - 1.0
    - 2.5
    - 5.0
    - 10.0
    - 25.0
  max_contracts_per_page: 80
  max_pages_per_refresh: 5 # Hard cap: 400 contracts max per refresh
  page_collect_timeout_sec: 2.25
  page_poll_interval_sec: 0.25
  inter_page_cooldown_sec: 0.35
  prefetch_exact_strikes: true
  contract_details_timeout_sec: 5.0
  contract_details_cooldown_sec: 0.10
  contract_details_cache_ttl_sec: 900.0

analytics:
  risk_free_rate: 0.0425   # 4.25% static default for BSM Greeks fallback
  unusual_volume_zscore_threshold: 2.0
  top_walls_count: 3

corridor:
  default_window_strikes: 5      # +-5 strikes around Primary Put & Call Walls
  default_max_contracts: 56      # Reserve headroom inside 60-contract hard ceiling
  hard_max_contracts: 60         # Strictly <= 60 concurrent subscriptions (< 100 IBKR ceiling)
  stream_poll_interval_sec: 0.75 # Throttled SSE emission / tick check cadence
  oneshot_collect_timeout_sec: 2.0
  heartbeat_interval_sec: 5.0

storage:
  mode: "ARCHIVE_MODE_1"
  data_dir: "data"
  snapshots_dir: "data/snapshots"
  latest_dir: "data/latest"
  metadata_index_file: "data/metadata/snapshot_index.json"
  logs_dir: "data/logs"   # rotating analyzer.log lives here

ledger:
  # Keep IBKR_FLEX_TOKEN in .env only (never commit tokens to YAML or git)
  flex_token: null
  flex_activity_query_id: null      # 365-day full Activity Flex Query ID
  flex_monthly_query_id: null       # Lighter 30-day/monthly Activity Flex Query placeholder for incremental sync
  flex_trade_conf_query_id: null    # Optional intraday Trade Confirmation Flex Query ID
  gateway_sync_enabled: false       # Explicit opt-in read-only Gateway reqExecutions/reqPositions sync
  gateway_include_stock: true       # Include STK fills & positions when Gateway ledger sync runs
  roll_max_gap_hours: 24.0          # Max time gap when pairing close->open option rolls
  ledger_dir: "data/ledger"

tracker:
  max_active_trades: 120            # Cap on ACTIVE paper trades (1-200)
  tracked_dir: "data/tracked"       # Inside data/, never inside data/snapshots